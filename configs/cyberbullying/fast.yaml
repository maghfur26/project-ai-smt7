task: cyberbullying

data:
  processed_dir: data/processed/cyberbullying
  text_col: text
  label_col: label
  num_labels: 2

model:
  max_length: 64

training:
  epochs: 2
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  logging_steps: 20
  early_stopping_patience: 1
  metric_for_best_model: macro_f1
  fp16: true
